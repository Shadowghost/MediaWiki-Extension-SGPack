name: CI

on:
  push:
    # Every branch, not just main: the five-version mediawiki matrix is the check that
    # decides whether a change is safe, and waiting for a pull request to learn that
    # means finding out after the work is finished. '**' matches branch names with
    # slashes in them, which '*' does not. Tags are deliberately left out.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

# A branch push and a pull request from that same branch would otherwise queue the
# nine-job matrix twice. github.head_ref is set only for pull_request events and holds
# the source branch, so both events land in the same group and the newer run cancels the
# older one. Pushes to main are exempt from the cancelling: that history is the record of
# what passed, and a run killed by the next push proves nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint sources
        run: |
          find . -path ./vendor -prune -o -path ./node_modules -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: composer test
        run: composer test

  js:
    name: JavaScript and i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: npm test
        run: npm test

  mediawiki:
    name: MediaWiki ${{ matrix.mw }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mw: REL1_43
            php: '8.3'
          - mw: REL1_44
            php: '8.3'
          - mw: REL1_45
            php: '8.3'
          - mw: REL1_46
            php: '8.3'
          - mw: master
            php: '8.4'
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Checkout MediaWiki core
        uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki
          ref: ${{ matrix.mw }}
          path: mediawiki

      - name: Checkout SGPack
        uses: actions/checkout@v4
        with:
          path: mediawiki/extensions/SGPack

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: ast, mbstring, intl, calendar

      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install SGPack dependencies
        working-directory: mediawiki/extensions/SGPack
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: phan
        working-directory: mediawiki/extensions/SGPack
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/mediawiki
        run: composer phan

      - name: Install a SQLite wiki with SGPack enabled
        working-directory: mediawiki
        run: |
          mkdir -p cache/sqlite
          php maintenance/install.php \
            --dbtype=sqlite \
            --dbpath="$PWD/cache/sqlite" \
            --scriptpath="" \
            --pass=ExamplePassword123 \
            TestWiki AdminUser
          {
            echo "wfLoadExtension( 'SGPack' );"
            echo "\$wgDevelopmentWarnings = true;"
          } >> LocalSettings.php
          php maintenance/run.php update --quick

      - name: Parser tests
        working-directory: mediawiki
        run: php tests/parser/parserTests.php --file=extensions/SGPack/tests/parser/SGPack.txt
